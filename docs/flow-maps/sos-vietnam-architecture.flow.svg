  <text x="625" y="480" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Lập Biên bản xác minh sự việc</text>
  <text x="625" y="496" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Lưu trữ bằng chứng âm thanh/hình ảnh</text>
  <text x="625" y="512" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Truy cứu chế tài NĐ 144/2021 (4-6 tr)</text>

