  <rect x="615" y="150" width="230" height="85" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="625" y="172" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="800">🗺️ Bản Đồ Tác Chiến MapLibre 3D</text>
  <text x="625" y="190" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Lớp ranh giới địa bàn 34 tỉnh/thành</text>
  <text x="625" y="206" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Marker vị trí trạm Công An, Y Tế, Cứu Nạn</text>
  <text x="625" y="222" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Cluster sự cố &amp; định tuyến điều xe</text>

