  <text x="625" y="290" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Scoping theo địa bàn (TP. Cần Thơ, Ninh Kiều...)</text>
  <text x="625" y="306" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Đẩy tín hiệu SSE thời gian thực</text>
  <text x="625" y="322" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Chuông reng cảnh báo trực ban liên tục</text>

