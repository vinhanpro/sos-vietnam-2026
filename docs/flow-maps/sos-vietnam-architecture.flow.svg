  <text x="912" y="192" fill="#34d399" font-family="sans-serif" font-size="10.5">• [Cách 1]: Tạo trực tiếp trên giao diện web</text>
  <text x="912" y="208" fill="#38bdf8" font-family="sans-serif" font-size="10.5">• [Cách 2]: Nhập/Xuất file Excel 4 sheet</text>
  <text x="912" y="224" fill="#cbd5e1" font-family="sans-serif" font-size="10">• Cột: "Thêm Tài Khoản (Thao Tác)"</text>
  <text x="912" y="238" fill="#cbd5e1" font-family="sans-serif" font-size="10">• Nạp tự động Công An, Y Tế, Cứu Nạn</text>
  <text x="912" y="250" fill="#cbd5e1" font-family="sans-serif" font-size="10">• Tự động sinh trạm vn-stations-directory</text>

  <!-- Node 4.2: Atomic Runtime Store -->
  <rect x="900" y="270" width="255" height="85" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="#34d399" stroke-width="1.2"/>
  <text x="912" y="292" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="800">💾 Atomic Runtime Data Store</text>
  <text x="912" y="310" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Ghi nguyên tử (atomic write) tránh corrupt</text>
  <text x="912" y="326" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Checkpoint sao lưu định kỳ tự động</text>
  <text x="912" y="342" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Lưu trữ hồ sơ sự cố &amp; ca trực ban</text>

