  <rect x="600" y="95" width="260" height="640" rx="14" fill="rgba(2, 132, 199, 0.04)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
  <rect x="612" y="105" width="236" height="32" rx="8" fill="url(#dispatchGrad)"/>
