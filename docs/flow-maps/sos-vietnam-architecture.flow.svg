  <text x="340" y="367" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="800">🔐 Zero-Trust RBAC & Session</text>
  <text x="340" y="385" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• HMAC-SHA256 Token kèm Nonce</text>
  <text x="340" y="401" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Phân quyền 3 cấp: Xã - Tỉnh - QG</text>
  <text x="340" y="417" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Instant Session Invalidation (Thu hồi)</text>

  <!-- Node 2.4: ND13 Audit & Encryption -->
  <rect x="330" y="445" width="230" height="90" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="#10b981" stroke-width="1.2"/>
  <text x="340" y="467" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="800">📜 Tuân Thủ Nghị Định 13/NĐ-CP</text>
  <text x="340" y="485" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Mã hóa bcrypt mật khẩu tài khoản</text>
  <text x="340" y="501" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Ghi nhật ký bảo mật bất biến (Audit)</text>
  <text x="340" y="517" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Che dấu dữ liệu nhạy cảm của dân</text>

