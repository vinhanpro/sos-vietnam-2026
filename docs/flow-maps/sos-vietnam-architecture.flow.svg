  <rect x="330" y="150" width="230" height="85" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="#ef4444" stroke-width="1.2"/>
  <text x="340" y="172" fill="#f87171" font-family="sans-serif" font-size="12" font-weight="800">🛡️ L7 Anti-AI & Bot Filter</text>
  <text x="340" y="190" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Phát hiện GPTBot, Headless, Scraper</text>
  <text x="340" y="206" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Chặn tức thì mã lỗi 403 Forbidden</text>
  <text x="340" y="222" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Bẫy Honeypot bảo vệ tài nguyên</text>

