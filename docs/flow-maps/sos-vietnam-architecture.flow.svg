  <rect x="330" y="250" width="230" height="80" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="340" y="272" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="800">⏱️ Token Bucket Rate Limiter</text>
  <text x="340" y="290" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Giới hạn tần suất phát tín hiệu SOS</text>
  <text x="340" y="306" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Ngăn chặn tấn công DoS / Flooding</text>
  <text x="340" y="322" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Tự động khóa IP khả nghi</text>

  <!-- Node 2.3: Zero-Trust RBAC & Session -->
