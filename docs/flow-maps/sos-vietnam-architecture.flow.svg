      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>

  <metadata>
    <system-spec name="SOS Vietnam 2026 Emergency System Architecture Flow Map" version="2.0">
      <lane id="lane1" name="Citizen Interface (PWA Client)"/>
      <lane id="lane2" name="Security & Transport Gateway (WAF L7)"/>
      <lane id="lane3" name="Operational Dispatcher (Center & MapLibre 3D)"/>
      <lane id="lane4" name="Data Store & Interoperability (Excel Two-Way Sync)"/>
    </system-spec>
  </metadata>

  <!-- Background -->
  <rect width="1200" height="820" fill="url(#bgGrad)"/>

  <!-- Title Header -->
  <rect x="30" y="20" width="1140" height="60" rx="12" fill="rgba(15, 23, 42, 0.8)" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)"/>
  <text x="50" y="56" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="1">HỆ THỐNG ĐIỀU PHỐI CỨU HỘ KHẨN CẤP QUỐC GIA — SOS VIỆT NAM 2026</text>
  <text x="890" y="55" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">SƠ ĐỒ KIẾN TRÚC & LUỒNG DỮ LIỆU TỔNG THỂ</text>

  <!-- ================= LANE 1: CITIZEN PWA INTERFACE ================= -->
  <rect x="30" y="95" width="260" height="640" rx="14" fill="rgba(16, 185, 129, 0.04)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1.5"/>
  <rect x="42" y="105" width="236" height="32" rx="8" fill="url(#citizenGrad)"/>
  <text x="160" y="126" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" text-anchor="middle">1. GIAO DIỆN NGƯỜI DÂN (PWA)</text>

  <!-- Node 1.1: 1-Click PWA Install -->
  <rect x="45" y="150" width="230" height="75" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="#34d399" stroke-width="1.2"/>
  <text x="55" y="172" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="800">⚡ Cài Lối Tắt 1-Click</text>
  <text x="55" y="190" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• iOS: Safari Share + Floating Beacon</text>
  <text x="55" y="206" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• PC: Native PWA + File .URL Shortcut</text>
  <text x="55" y="220" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Android: beforeinstallprompt 1-Tap</text>

  <!-- Node 1.2: Master SOS Orb -->
  <rect x="45" y="240" width="230" height="85" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="55" y="262" fill="#fbbf24" font-family="sans-serif" font-size="12.5" font-weight="800">🔴 Master SOS Orb (1-Chạm)</text>
  <text x="55" y="280" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• 3D Shockwave Crystal Explosion</text>
  <text x="55" y="296" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Haptic Vibration + Voice AI Prompt</text>
  <text x="55" y="312" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Kích hoạt còi hú tác chiến (Siren SFX)</text>

  <!-- Node 1.3: Geolocation Engine -->
  <rect x="45" y="340" width="230" height="75" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="55" y="362" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="800">🛰️ Định Vị GPS Vệ Tinh</text>
  <text x="55" y="380" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Reverse Geocoding địa chỉ tiếng Việt</text>
  <text x="55" y="396" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Xác định ranh giới Xã/Phường/Tỉnh</text>
  <text x="55" y="410" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Bán kính sai số &lt; 5m</text>

  <!-- Node 1.4: Multimedia Capture -->
  <rect x="45" y="430" width="230" height="80" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="#a855f7" stroke-width="1.2"/>
  <text x="55" y="452" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="800">🎙️ Bằng Chứng Đa Phương Tiện</text>
  <text x="55" y="470" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Ghi âm hiện trường nén MP3 LAME</text>
  <text x="55" y="486" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Ảnh/Video hiện trường trực tiếp</text>
  <text x="55" y="502" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Đàm thoại 2 chiều với Trực ban</text>

  <!-- Node 1.5: Offline Sync & Service Worker -->
  <rect x="45" y="525" width="230" height="75" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="#64748b" stroke-width="1.2"/>
  <text x="55" y="547" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="800">⚡ Service Worker (sw.js)</text>
  <text x="55" y="565" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Cache-First tài nguyên tĩnh</text>
  <text x="55" y="581" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Background Sync khi mất mạng</text>
  <text x="55" y="595" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Sẵn sàng 100% ngoại tuyến</text>

  <!-- ================= LANE 2: SECURITY GATEWAY (WAF L7) ================= -->
  <rect x="315" y="95" width="260" height="640" rx="14" fill="rgba(239, 68, 68, 0.04)" stroke="rgba(248, 113, 113, 0.3)" stroke-width="1.5"/>
  <rect x="327" y="105" width="236" height="32" rx="8" fill="url(#secGrad)"/>
  <text x="445" y="126" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" text-anchor="middle">2. TƯỜNG LỬA BẢO MẬT (WAF L7)</text>

