  <rect x="900" y="370" width="255" height="75" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="912" y="392" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="800">📑 Xuất Báo Cáo DOCX / PDF Chuẩn</text>
  <text x="912" y="410" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Định dạng hành chính Nghị định 30/2020</text>
  <text x="912" y="426" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Tích hợp biểu đồ thống kê Chart.js</text>
  <text x="912" y="440" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Sẵn sàng in ấn bàn giao nghiệp vụ</text>

