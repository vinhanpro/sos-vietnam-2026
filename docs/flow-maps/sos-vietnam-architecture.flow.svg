  <text x="625" y="390" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Ghi nhận Cán bộ trực ban đương nhiệm</text>
  <text x="625" y="406" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Giao ban, lưu phiên trực &amp; chữ ký</text>
  <text x="625" y="420" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Ràng buộc hồ sơ pháp lý NĐ 144</text>

