<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#050a14; font-family:'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <linearGradient id="n-bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a14"/>
      <stop offset="50%" stop-color="#091322"/>
      <stop offset="100%" stop-color="#03060c"/>
    </linearGradient>
    <linearGradient id="n-cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.65)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)"/>
    </linearGradient>
    <filter id="n-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#n-bgGrad)"/>
  <circle cx="250" cy="180" r="300" fill="#dc2626" opacity="0.1" filter="url(#n-glow)"/>
  <circle cx="1350" cy="720" r="320" fill="#f59e0b" opacity="0.08" filter="url(#n-glow)"/>

  <!-- Header Banner -->
  <g transform="translate(80, 50)">
    <rect width="1440" height="85" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="25" y="18" width="50" height="50" rx="10" fill="#dc2626"/>
    <text x="50" y="52" fill="#ffffff" font-size="24" font-weight="900" text-anchor="middle">HQ</text>
    <text x="95" y="44" fill="#ffffff" font-size="22" font-weight="800" letter-spacing="1">TRUNG TÂM CHỈ HUY TỔNG HỢP QUỐC GIA (C4ISR) — QUY TRÌNH 5 BƯỚC ĐIỀU HÀNH VĨ MÔ</text>
    <text x="95" y="68" fill="#fca5a5" font-size="14" font-weight="500">Bao quát 34 Tỉnh Thành • Quản trị 192 Trạm • Thẩm duyệt Doanh nghiệp Cứu hộ Top 5★ • Điều phối Chi viện Liên tỉnh • Kiểm toán Cấp ủy</text>
    <rect x="1270" y="26" width="145" height="34" rx="17" fill="rgba(239, 68, 68, 0.2)" stroke="#f87171" stroke-width="1"/>
    <text x="1342" y="49" fill="#fca5a5" font-size="13" font-weight="700" text-anchor="middle">C4ISR QUỐC GIA</text>
  </g>

  <!-- 5 Sequential Step Cards -->
  <!-- STEP 1 -->
  <g transform="translate(80, 180)">
    <rect width="265" height="480" rx="18" fill="url(#n-cardGrad)" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="18" y="20" width="44" height="44" rx="10" fill="#dc2626"/>
    <text x="40" y="50" fill="#ffffff" font-size="20" font-weight="900" text-anchor="middle">Q1</text>
    <text x="74" y="38" fill="#f87171" font-size="12" font-weight="700">CHIẾN LƯỢC 1</text>
    <text x="74" y="56" fill="#ffffff" font-size="15" font-weight="800">C4ISR 34 TỈNH THÀNH</text>
    <line x1="20" y1="80" x2="245" y2="80" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

    <text x="20" y="112" fill="#fecaca" font-size="13" font-weight="700">• 5 Hàng Đợi Toàn Quốc:</text>
    <text x="20" y="134" fill="#94a3b8" font-size="12">Bao quát Công An, CSGT, PCCC,</text>
    <text x="20" y="152" fill="#94a3b8" font-size="12">Cứu hộ giao thông &amp; Y tế 115.</text>

    <text x="20" y="186" fill="#fecaca" font-size="13" font-weight="700">• Dòng Dữ Liệu Lớn (Big Data):</text>
    <text x="20" y="208" fill="#94a3b8" font-size="12">Phát hiện chuỗi biến cố bất thường,</text>
    <text x="20" y="226" fill="#94a3b8" font-size="12">thiên tai, bão lũ, sự cố liên vùng.</text>

    <text x="20" y="260" fill="#fecaca" font-size="13" font-weight="700">• Bản Đồ C4ISR Vĩ Mô:</text>
    <text x="20" y="282" fill="#94a3b8" font-size="12">Tích hợp radar vệ tinh, thủy văn,</text>
    <text x="20" y="300" fill="#94a3b8" font-size="12">mật độ giao thông quốc lộ/cao tốc.</text>

    <rect x="20" y="380" width="225" height="75" rx="10" fill="rgba(220, 38, 38, 0.15)" stroke="#ef4444" stroke-width="1"/>
    <text x="32" y="405" fill="#f87171" font-size="11" font-weight="700">QUY MÔ GIÁM SÁT:</text>
    <text x="32" y="425" fill="#ffffff" font-size="12" font-weight="600">34 Tỉnh • 3.321 Xã/Phường</text>
    <text x="32" y="443" fill="#cbd5e1" font-size="11">Luồng khẩn cấp thời gian thực</text>
  </g>

  <!-- STEP 2 -->
  <g transform="translate(375, 180)">
    <rect width="265" height="480" rx="18" fill="url(#n-cardGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="18" y="20" width="44" height="44" rx="10" fill="#2563eb"/>
    <text x="40" y="50" fill="#ffffff" font-size="20" font-weight="900" text-anchor="middle">Q2</text>
    <text x="74" y="38" fill="#60a5fa" font-size="12" font-weight="700">CHIẾN LƯỢC 2</text>
    <text x="74" y="56" fill="#ffffff" font-size="15" font-weight="800">192 TRẠM &amp; EXCEL 4S</text>
    <line x1="20" y1="80" x2="245" y2="80" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

    <text x="20" y="112" fill="#bfdbfe" font-size="13" font-weight="700">• Quản Trị 192 Trạm Tác Chiến:</text>
    <text x="20" y="134" fill="#94a3b8" font-size="12">Phân quyền đa cấp (RBAC),</text>
    <text x="20" y="152" fill="#94a3b8" font-size="12">kiểm soát mật khẩu, phiên làm việc.</text>

    <text x="20" y="186" fill="#bfdbfe" font-size="13" font-weight="700">• Động Cơ Đồng Bộ Excel 4S:</text>
    <text x="20" y="208" fill="#94a3b8" font-size="12">Đồng bộ hai chiều danh bạ trạm,</text>
    <text x="20" y="226" fill="#94a3b8" font-size="12">đường dây nóng, cơ cấu lãnh đạo.</text>

    <text x="20" y="260" fill="#bfdbfe" font-size="13" font-weight="700">• Ủy Quyền Tác Chiến Địa Phương:</text>
    <text x="20" y="282" fill="#94a3b8" font-size="12">Phân bổ vùng phụ trách an toàn,</text>
    <text x="20" y="300" fill="#94a3b8" font-size="12">chống phân mảnh dữ liệu chỉ huy.</text>

    <rect x="20" y="380" width="225" height="75" rx="10" fill="rgba(37, 99, 235, 0.15)" stroke="#3b82f6" stroke-width="1"/>
    <text x="32" y="405" fill="#60a5fa" font-size="11" font-weight="700">CÔNG CỤ QUẢN TRỊ:</text>
    <text x="32" y="425" fill="#ffffff" font-size="12" font-weight="600">Admin Officer Modal &amp; Sync</text>
    <text x="32" y="443" fill="#cbd5e1" font-size="11">Dữ liệu 4 sheet danh bạ tức thời</text>
  </g>

  <!-- STEP 3 -->
  <g transform="translate(670, 180)">
    <rect width="265" height="480" rx="18" fill="url(#n-cardGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="18" y="20" width="44" height="44" rx="10" fill="#d97706"/>
    <text x="40" y="50" fill="#ffffff" font-size="20" font-weight="900" text-anchor="middle">Q3</text>
    <text x="74" y="38" fill="#fbbf24" font-size="12" font-weight="700">CHIẾN LƯỢC 3</text>
    <text x="74" y="56" fill="#ffffff" font-size="15" font-weight="800">DOANH NGHIỆP CỨU HỘ</text>
    <line x1="20" y1="80" x2="245" y2="80" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

    <text x="20" y="112" fill="#fef08a" font-size="13" font-weight="700">• Thẩm Duyệt Năng Lực Pháp Lý:</text>
    <text x="20" y="134" fill="#94a3b8" font-size="12">Kiểm tra giấy phép kinh doanh,</text>
    <text x="20" y="152" fill="#94a3b8" font-size="12">chứng nhận đăng kiểm xe cẩu kéo.</text>

    <text x="20" y="186" fill="#fef08a" font-size="13" font-weight="700">• Xếp Hạng Sao Uy Tín (Top 5★):</text>
    <text x="20" y="208" fill="#94a3b8" font-size="12">Đánh giá sao chất lượng phục vụ,</text>
    <text x="20" y="226" fill="#94a3b8" font-size="12">niêm yết đơn giá minh bạch toàn dân.</text>

    <text x="20" y="260" fill="#fef08a" font-size="13" font-weight="700">• Chế Tài Thu Hồi Giấy Phép:</text>
    <text x="20" y="282" fill="#94a3b8" font-size="12">Đình chỉ tức khắc doanh nghiệp</text>
    <text x="20" y="300" fill="#94a3b8" font-size="12">ép giá nạn nhân hoặc vi phạm đạo đức.</text>

    <rect x="20" y="380" width="225" height="75" rx="10" fill="rgba(217, 119, 6, 0.15)" stroke="#f59e0b" stroke-width="1"/>
    <text x="32" y="405" fill="#fbbf24" font-size="11" font-weight="700">CHỈ TIÊU CHUẨN HÓA:</text>
    <text x="32" y="425" fill="#ffffff" font-size="12" font-weight="600">Enterprise Mgmt Modal</text>
    <text x="32" y="443" fill="#cbd5e1" font-size="11">Xóa bỏ triệt để nạn ép giá</text>
  </g>

  <!-- STEP 4 -->
  <g transform="translate(965, 180)">
    <rect width="265" height="480" rx="18" fill="url(#n-cardGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="18" y="20" width="44" height="44" rx="10" fill="#7c3aed"/>
    <text x="40" y="50" fill="#ffffff" font-size="20" font-weight="900" text-anchor="middle">Q4</text>
    <text x="74" y="38" fill="#c4b5fd" font-size="12" font-weight="700">CHIẾN LƯỢC 4</text>
    <text x="74" y="56" fill="#ffffff" font-size="15" font-weight="800">THỐNG KÊ &amp; LIÊN QUÂN</text>
    <line x1="20" y1="80" x2="245" y2="80" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

    <text x="20" y="112" fill="#ddd6fe" font-size="13" font-weight="700">• Thống Kê Lãnh Thổ Vĩ Mô:</text>
    <text x="20" y="134" fill="#94a3b8" font-size="12">Bảng tổng hợp sự cố chi tiết</text>
    <text x="20" y="152" fill="#94a3b8" font-size="12">phân loại theo tỉnh, huyện, xã.</text>

    <text x="20" y="186" fill="#ddd6fe" font-size="13" font-weight="700">• Chi Viện Tác Chiến Liên Tỉnh:</text>
    <text x="20" y="208" fill="#94a3b8" font-size="12">Lệnh điều động xe thang PCCC,</text>
    <text x="20" y="226" fill="#94a3b8" font-size="12">xe đặc chủng từ địa phương lân cận.</text>

    <text x="20" y="260" fill="#ddd6fe" font-size="13" font-weight="700">• Hiệp Đồng Quân Dân Y Tế:</text>
    <text x="20" y="282" fill="#94a3b8" font-size="12">Điều chuyển Trực thăng PK-KQ,</text>
    <text x="20" y="300" fill="#94a3b8" font-size="12">Cảnh sát cơ động, tàu cứu nạn Biển Đông.</text>

    <rect x="20" y="380" width="225" height="75" rx="10" fill="rgba(124, 58, 237, 0.15)" stroke="#8b5cf6" stroke-width="1"/>
    <text x="32" y="405" fill="#c4b5fd" font-size="11" font-weight="700">CƠ CHẾ HIỆP ĐỒNG:</text>
    <text x="32" y="425" fill="#ffffff" font-size="12" font-weight="600">Territory Stats &amp; Dispatch</text>
    <text x="32" y="443" fill="#cbd5e1" font-size="11">Ứng phó thảm họa đa ngành</text>
  </g>

  <!-- STEP 5 -->
  <g transform="translate(1255, 180)">
    <rect width="265" height="480" rx="18" fill="url(#n-cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="18" y="20" width="44" height="44" rx="10" fill="#059669"/>
    <text x="40" y="50" fill="#ffffff" font-size="20" font-weight="900" text-anchor="middle">Q5</text>
    <text x="74" y="38" fill="#34d399" font-size="12" font-weight="700">CHIẾN LƯỢC 5</text>
    <text x="74" y="56" fill="#ffffff" font-size="15" font-weight="800">KIỂM TOÁN &amp; BÁO CÁO</text>
    <line x1="20" y1="80" x2="245" y2="80" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

    <text x="20" y="112" fill="#a7f3d0" font-size="13" font-weight="700">• Security Audit Logs Cấp 4:</text>
    <text x="20" y="134" fill="#94a3b8" font-size="12">Lưu vết mọi hành động trực ban,</text>
    <text x="20" y="152" fill="#94a3b8" font-size="12">chống chối bỏ bằng SHA-256 hash.</text>

    <text x="20" y="186" fill="#a7f3d0" font-size="13" font-weight="700">• Kiểm Soát An Toàn An Ninh Mạng:</text>
    <text x="20" y="208" fill="#94a3b8" font-size="12">Phát hiện truy cập bất thường,</text>
    <text x="20" y="226" fill="#94a3b8" font-size="12">khóa tức thì tài khoản vi phạm.</text>

    <text x="20" y="260" fill="#a7f3d0" font-size="13" font-weight="700">• Báo Cáo Chiến Lược Quốc Gia:</text>
    <text x="20" y="282" fill="#94a3b8" font-size="12">Kết xuất báo cáo phục vụ Thủ tướng,</text>
    <text x="20" y="300" fill="#94a3b8" font-size="12">Bộ Công An, Ban Chỉ đạo Quốc gia.</text>

    <rect x="20" y="380" width="225" height="75" rx="10" fill="rgba(5, 150, 105, 0.15)" stroke="#10b981" stroke-width="1"/>
    <text x="32" y="405" fill="#34d399" font-size="11" font-weight="700">SẢN PHẨM CHIẾN LƯỢC:</text>
    <text x="32" y="425" fill="#ffffff" font-size="12" font-weight="600">National Executive Report</text>
    <text x="32" y="443" fill="#cbd5e1" font-size="11">Bảo đảm tính toàn vẹn tuyệt đối</text>
  </g>

  <!-- Connective Arrows -->
  <g stroke="#f87171" stroke-width="2.5" fill="none" opacity="0.8">
    <path d="M 345 420 L 370 420"/>
    <path d="M 640 420 L 665 420"/>
    <path d="M 935 420 L 960 420"/>
    <path d="M 1230 420 L 1250 420"/>
  </g>

  <!-- Footer Info Bar -->
  <g transform="translate(80, 700)">
    <rect width="1440" height="150" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.1)"/>
    <text x="30" y="40" fill="#f87171" font-size="16" font-weight="800">TRỤ CỘT ĐIỀU HÀNH TỐI CAO CỦA TRUNG TÂM CHỈ HUY TỔNG HỢP QUỐC GIA (C4ISR):</text>
    
    <text x="30" y="75" fill="#ffffff" font-size="13" font-weight="600">1. Quyền chỉ huy tối cao liên ngành:</text>
    <text x="290" y="75" fill="#94a3b8" font-size="13">Thẩm quyền thống nhất điều phối giữa Công an, Quân đội, Giao thông, Y tế và Tìm kiếm cứu nạn.</text>

    <text x="30" y="105" fill="#ffffff" font-size="13" font-weight="600">2. Chuẩn hóa hạ tầng 192 trạm tác chiến:</text>
    <text x="290" y="105" fill="#94a3b8" font-size="13">Bảo đảm quy trình trực ban đồng nhất, trang bị hạ tầng số và danh bạ dữ liệu 4 sheet cập nhật tức thời.</text>

    <text x="30" y="132" fill="#ffffff" font-size="13" font-weight="600">3. Bất biến dữ liệu &amp; Kiểm toán cấp ủy:</text>
    <text x="290" y="132" fill="#94a3b8" font-size="13">Tất cả biên bản và lệnh điều động được mã hóa bảo mật cấp độ 4, phục vụ công tác thanh tra, kiểm tra và quyết sách vĩ mô.</text>
  </g>
</svg>