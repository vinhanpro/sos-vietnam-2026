<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#070d18; font-family:'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <linearGradient id="esc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d18"/>
      <stop offset="50%" stop-color="#0b172a"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="esc-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 58, 102, 0.55)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.75)"/>
    </linearGradient>
    <filter id="esc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#esc-bg)"/>
  <circle cx="200" cy="180" r="280" fill="#f59e0b" opacity="0.1" filter="url(#esc-glow)"/>
  <circle cx="1400" cy="720" r="320" fill="#3b82f6" opacity="0.1" filter="url(#esc-glow)"/>

  <!-- Header -->
  <g transform="translate(80, 50)">
    <rect width="1440" height="85" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="25" y="18" width="50" height="50" rx="10" fill="#d97706"/>
    <text x="50" y="52" fill="#ffffff" font-size="24" font-weight="900" text-anchor="middle">⚡</text>
    <text x="95" y="44" fill="#ffffff" font-size="22" font-weight="800" letter-spacing="1">CƠ CHẾ CHUYỂN CẤP TỰ ĐỘNG (TIMEOUT ESCALATION) &amp; CHUYỂN TRẢ VỀ CƠ SỞ (DE-ESCALATION)</text>
    <text x="95" y="68" fill="#fcd34d" font-size="14" font-weight="500">Giám sát quá hạn tiếp nhận 15 phút • Cảnh báo tuyến Tỉnh/Thành phố • Quyền chỉ đạo chuyển trả về cấp Xã/Phường</text>
    <rect x="1260" y="26" width="155" height="34" rx="17" fill="rgba(245, 158, 11, 0.2)" stroke="#fcd34d" stroke-width="1"/>
    <text x="1337" y="49" fill="#fcd34d" font-size="13" font-weight="700" text-anchor="middle">PHÂN CẤP CHỈ HUY</text>
  </g>

  <!-- 4 Process Blocks -->
  <!-- BLOCK 1: Commune Level Intake & Timer -->
  <g transform="translate(80, 180)">
    <rect width="330" height="480" rx="18" fill="url(#esc-card)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="20" y="20" width="44" height="44" rx="10" fill="#2563eb"/>
    <text x="42" y="50" fill="#ffffff" font-size="18" font-weight="900" text-anchor="middle">1</text>
    <text x="76" y="38" fill="#60a5fa" font-size="12" font-weight="700">CẤP XÃ / PHƯỜNG</text>
    <text x="76" y="56" fill="#ffffff" font-size="15" font-weight="800">TIẾP NHẬN ĐỊA BÀN</text>
    <line x1="20" y1="80" x2="310" y2="80" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

    <text x="20" y="115" fill="#bfdbfe" font-size="13" font-weight="700">• Định Tuyến Sự Vụ Ban Đầu:</text>
    <text x="20" y="137" fill="#94a3b8" font-size="12">Sự vụ định vị theo ranh giới xã/phường</text>
    <text x="20" y="155" fill="#94a3b8" font-size="12">và giao cho đơn vị cơ sở sở tại.</text>

    <text x="20" y="190" fill="#bfdbfe" font-size="13" font-weight="700">• Kích Hoạt Bộ Đếm Timeout 15 Phút:</text>
    <text x="20" y="212" fill="#94a3b8" font-size="12">Server khởi động escalation timer</text>
    <text x="20" y="230" fill="#fcd34d" font-size="12" font-weight="700">đếm ngược 15 phút (900.000 ms).</text>

    <text x="20" y="265" fill="#bfdbfe" font-size="13" font-weight="700">• Nhánh Tiếp Nhận Kịp Thời:</text>
    <text x="20" y="287" fill="#94a3b8" font-size="12">Nếu trực ban cơ sở nhấn TIẾP NHẬN</text>
    <text x="20" y="305" fill="#94a3b8" font-size="12">trước 15 phút ➔ Timer hủy bỏ,</text>
    <text x="20" y="323" fill="#34d399" font-size="12" font-weight="700">đơn vị cơ sở trực tiếp xử lý.</text>

    <rect x="20" y="375" width="290" height="80" rx="10" fill="rgba(59, 130, 246, 0.15)" stroke="#3b82f6" stroke-width="1"/>
    <text x="32" y="402" fill="#60a5fa" font-size="11" font-weight="700">TRẠNG THÁI KHỞI ĐẦU:</text>
    <text x="32" y="422" fill="#ffffff" font-size="12" font-weight="600">Level: 'ward' • Status: 'pending'</text>
    <text x="32" y="440" fill="#cbd5e1" font-size="11">Thời gian phản ứng chuẩn &lt; 15 phút</text>
  </g>

  <!-- BLOCK 2: Timeout Trigger & Auto-Escalation -->
  <g transform="translate(450, 180)">
    <rect width="330" height="480" rx="18" fill="url(#esc-card)" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="20" y="20" width="44" height="44" rx="10" fill="#dc2626"/>
    <text x="42" y="50" fill="#ffffff" font-size="18" font-weight="900" text-anchor="middle">2</text>
    <text x="76" y="38" fill="#f87171" font-size="12" font-weight="700">MÁY CHỦ HỆ THỐNG</text>
    <text x="76" y="56" fill="#ffffff" font-size="15" font-weight="800">CHUYỂN CẤP TỰ ĐỘNG</text>
    <line x1="20" y1="80" x2="310" y2="80" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

    <text x="20" y="115" fill="#fecaca" font-size="13" font-weight="700">• Điều Kiện Kích Hoạt Chuyển Cấp:</text>
    <text x="20" y="137" fill="#94a3b8" font-size="12">Thời gian chờ vượt quá 15 phút và</text>
    <text x="20" y="155" fill="#94a3b8" font-size="12">trạng thái sự vụ vẫn là 'pending'.</text>

    <text x="20" y="190" fill="#fecaca" font-size="13" font-weight="700">• Cập Nhật Dữ Liệu Tức Thời:</text>
    <text x="20" y="212" fill="#ffffff" font-size="12">inc.currentLevel = 'province'</text>
    <text x="20" y="230" fill="#ffffff" font-size="12">inc.status = 'escalated'</text>

    <text x="20" y="265" fill="#fecaca" font-size="13" font-weight="700">• Broadcast Sự Vụ Khẩn Cấp:</text>
    <text x="20" y="287" fill="#94a3b8" font-size="12">Phát sự kiện 'sos_escalate' qua WebSocket</text>
    <text x="20" y="305" fill="#94a3b8" font-size="12">tới toàn bộ bàn trực ban cấp Tỉnh/TP.</text>
    <text x="20" y="323" fill="#f87171" font-size="12" font-weight="700">Chuông báo động chuyển cấp reo vang.</text>

    <rect x="20" y="375" width="290" height="80" rx="10" fill="rgba(220, 38, 38, 0.15)" stroke="#ef4444" stroke-width="1"/>
    <text x="32" y="402" fill="#f87171" font-size="11" font-weight="700">DỮ LIỆU ĐỔI TRẠNG THÁI:</text>
    <text x="32" y="422" fill="#ffffff" font-size="12" font-weight="600">Level: 'province' • Status: 'escalated'</text>
    <text x="32" y="440" fill="#cbd5e1" font-size="11">Cảnh báo đỏ xuất hiện trên Drawer</text>
  </g>

  <!-- BLOCK 3: Provincial Command Center Actions -->
  <g transform="translate(820, 180)">
    <rect width="330" height="480" rx="18" fill="url(#esc-card)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="20" y="20" width="44" height="44" rx="10" fill="#d97706"/>
    <text x="42" y="50" fill="#ffffff" font-size="18" font-weight="900" text-anchor="middle">3</text>
    <text x="76" y="38" fill="#fbbf24" font-size="12" font-weight="700">CẤP TỈNH / THÀNH PHỐ</text>
    <text x="76" y="56" fill="#ffffff" font-size="15" font-weight="800">XEM XÉT &amp; RA QUYẾT ĐỊNH</text>
    <line x1="20" y1="80" x2="310" y2="80" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

    <text x="20" y="115" fill="#fef08a" font-size="13" font-weight="700">• Drawer Cảnh Báo Chuyển Cấp:</text>
    <text x="20" y="137" fill="#94a3b8" font-size="12">Hiển thị thẻ drawerEscalatedWardNotice</text>
    <text x="20" y="155" fill="#94a3b8" font-size="12">nêu rõ tên đơn vị cấp xã chậm trễ.</text>

    <text x="20" y="190" fill="#fef08a" font-size="13" font-weight="700">• LỰA CHỌN A: Tiếp Nhận &amp; Điều Động:</text>
    <text x="20" y="212" fill="#94a3b8" font-size="12">Chỉ huy Tỉnh trực tiếp ra lệnh</text>
    <text x="20" y="230" fill="#94a3b8" font-size="12">điều động lực lượng phản ứng nhanh tỉnh.</text>

    <text x="20" y="265" fill="#fef08a" font-size="13" font-weight="700">• LỰA CHỌN B: Chuyển Trả Về Cơ Sở:</text>
    <text x="20" y="287" fill="#94a3b8" font-size="12">Nhấn 'btnDeEscalateSOS' ➔</text>
    <text x="20" y="305" fill="#94a3b8" font-size="12">Nhập lý do chỉ đạo nghiệp vụ ➔</text>
    <text x="20" y="323" fill="#fbbf24" font-size="12" font-weight="700">Chuyển trả về Công An xã/phường.</text>

    <rect x="20" y="375" width="290" height="80" rx="10" fill="rgba(217, 119, 6, 0.15)" stroke="#f59e0b" stroke-width="1"/>
    <text x="32" y="402" fill="#fbbf24" font-size="11" font-weight="700">QUYỀN HẠN CỦA TỈNH/TP:</text>
    <text x="32" y="422" fill="#ffffff" font-size="12" font-weight="600">Tiếp nhận chi viện HOẶC Chuyển trả</text>
    <text x="32" y="440" fill="#cbd5e1" font-size="11">Phê duyệt chỉ đạo có lưu vết</text>
  </g>

  <!-- BLOCK 4: De-escalation & Reassignment Loop -->
  <g transform="translate(1190, 180)">
    <rect width="330" height="480" rx="18" fill="url(#esc-card)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="20" y="20" width="44" height="44" rx="10" fill="#059669"/>
    <text x="42" y="50" fill="#ffffff" font-size="18" font-weight="900" text-anchor="middle">4</text>
    <text x="76" y="38" fill="#34d399" font-size="12" font-weight="700">CƠ SỞ TIẾP NHẬN LẠI</text>
    <text x="76" y="56" fill="#ffffff" font-size="15" font-weight="800">HOÀN TẤT NHIỆM VỤ</text>
    <line x1="20" y1="80" x2="310" y2="80" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

    <text x="20" y="115" fill="#a7f3d0" font-size="13" font-weight="700">• API /api/dispatcher/de-escalate:</text>
    <text x="20" y="137" fill="#94a3b8" font-size="12">Ghi nhận lý do chuyển trả của Tỉnh,</text>
    <text x="20" y="155" fill="#94a3b8" font-size="12">lưu vết cán bộ ra lệnh chuyển trả.</text>

    <text x="20" y="190" fill="#a7f3d0" font-size="13" font-weight="700">• Thiết Lập Lại Bộ Đếm Giờ:</text>
    <text x="20" y="212" fill="#94a3b8" font-size="12">currentLevel trả về 'ward',</text>
    <text x="20" y="230" fill="#94a3b8" font-size="12">khởi động lại timer giám sát xử lý.</text>

    <text x="20" y="265" fill="#a7f3d0" font-size="13" font-weight="700">• Xuất Kích &amp; Ký Số Báo Cáo:</text>
    <text x="20" y="287" fill="#94a3b8" font-size="12">Công An xã/phường xuất kích khẩn cấp,</text>
    <text x="20" y="305" fill="#94a3b8" font-size="12">khống chế hiện trường, lập biên bản NĐ 30</text>
    <text x="20" y="323" fill="#34d399" font-size="12" font-weight="700">và gửi báo cáo giải trình cấp Tỉnh.</text>

    <rect x="20" y="375" width="290" height="80" rx="10" fill="rgba(5, 150, 105, 0.15)" stroke="#10b981" stroke-width="1"/>
    <text x="32" y="402" fill="#34d399" font-size="11" font-weight="700">KẾT QUẢ CUỐI CÙNG:</text>
    <text x="32" y="422" fill="#ffffff" font-size="12" font-weight="600">Trách nhiệm cơ sở được khôi phục</text>
    <text x="32" y="440" fill="#cbd5e1" font-size="11">Khắc phục triệt để tình trạng bỏ lọt ca</text>
  </g>

  <!-- Connective Arrows -->
  <g stroke="#f59e0b" stroke-width="2.5" fill="none" opacity="0.8">
    <path d="M 410 420 L 445 420"/>
    <path d="M 780 420 L 815 420"/>
    <path d="M 1150 420 L 1185 420"/>
  </g>

  <!-- Footer -->
  <g transform="translate(80, 700)">
    <rect width="1440" height="150" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.1)"/>
    <text x="30" y="40" fill="#fcd34d" font-size="16" font-weight="800">Ý NGHĨA QUẢN LÝ NHÀ NƯỚC CỦA CƠ CHẾ CHUYỂN CẤP VÀ CHUYỂN TRẢ:</text>
    <text x="30" y="75" fill="#ffffff" font-size="13" font-weight="600">1. Chống đùn đẩy trách nhiệm:</text>
    <text x="260" y="75" fill="#94a3b8" font-size="13">Bộ đếm thời gian 15 phút buộc cán bộ cơ sở phải túc trực 24/7, không để xảy ra tình trạng người dân chờ đợi vô vọng.</text>
    <text x="30" y="105" fill="#ffffff" font-size="13" font-weight="600">2. Linh hoạt quyền chỉ đạo tác chiến:</text>
    <text x="260" y="105" fill="#94a3b8" font-size="13">Cấp tỉnh có toàn quyền đánh giá tính chất vụ việc để chi viện ngay hoặc yêu cầu cơ sở tiếp tục xử lý theo thẩm quyền.</text>
    <text x="30" y="132" fill="#ffffff" font-size="13" font-weight="600">3. Lưu vết phục vụ thanh tra công vụ:</text>
    <text x="260" y="132" fill="#94a3b8" font-size="13">Mọi hành vi quá hạn tiếp nhận hoặc chuyển trả đều ghi nhận vào Sổ trực ban điện tử phục vụ kiểm toán công vụ định kỳ.</text>
  </g>
</svg>