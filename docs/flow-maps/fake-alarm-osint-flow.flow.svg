<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#070d18; font-family:'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <linearGradient id="os-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d18"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#05070f"/>
    </linearGradient>
    <linearGradient id="os-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(31, 41, 55, 0.65)"/>
      <stop offset="100%" stop-color="rgba(17, 24, 39, 0.85)"/>
    </linearGradient>
    <filter id="os-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#os-bg)"/>
  <circle cx="200" cy="200" r="300" fill="#dc2626" opacity="0.1" filter="url(#os-glow)"/>
  <circle cx="1400" cy="700" r="320" fill="#7c3aed" opacity="0.1" filter="url(#os-glow)"/>

  <!-- Header -->
  <g transform="translate(80, 50)">
    <rect width="1440" height="85" rx="16" fill="rgba(17, 24, 39, 0.85)" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="25" y="18" width="50" height="50" rx="10" fill="#dc2626"/>
    <text x="50" y="52" fill="#ffffff" font-size="24" font-weight="900" text-anchor="middle">🚨</text>
    <text x="95" y="44" fill="#ffffff" font-size="22" font-weight="800" letter-spacing="1">QUY TRÌNH XỬ LÝ CHẾ TÀI BÁO KHỐNG &amp; ĐIỀU TRA DẤU VẾT SỐ OSINT (NĐ 144/2021/NĐ-CP)</text>
    <text x="95" y="68" fill="#fca5a5" font-size="14" font-weight="500">Xác nhận hiện trường giả • Trích xuất Cyber Forensics • Lệnh Linux OSINT • Xử phạt 3 - 5 triệu đồng • Blacklist toàn quốc</text>
    <rect x="1270" y="26" width="145" height="34" rx="17" fill="rgba(239, 68, 68, 0.2)" stroke="#f87171" stroke-width="1"/>
    <text x="1342" y="49" fill="#fca5a5" font-size="13" font-weight="700" text-anchor="middle">NGHỊ ĐỊNH 144</text>
  </g>

  <!-- 4 Sequential Step Blocks -->
  <!-- STEP 1 -->
  <g transform="translate(80, 180)">
    <rect width="330" height="480" rx="18" fill="url(#os-card)" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="20" y="20" width="44" height="44" rx="10" fill="#dc2626"/>
    <text x="42" y="50" fill="#ffffff" font-size="18" font-weight="900" text-anchor="middle">1</text>
    <text x="76" y="38" fill="#f87171" font-size="12" font-weight="700">HIỆN TRƯỜNG THỰC ĐỊA</text>
    <text x="76" y="56" fill="#ffffff" font-size="15" font-weight="800">XÁC MINH SỰ THẬT</text>
    <line x1="20" y1="80" x2="310" y2="80" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

    <text x="20" y="115" fill="#fecaca" font-size="13" font-weight="700">• Tiếp Cận Hiện Trường:</text>
    <text x="20" y="137" fill="#94a3b8" font-size="12">Tổ công tác 113 / CSKV có mặt tại</text>
    <text x="20" y="155" fill="#94a3b8" font-size="12">tọa độ GPS người dân báo tin.</text>

    <text x="20" y="190" fill="#fecaca" font-size="13" font-weight="700">• Đánh Giá Tính Chất Sự Việc:</text>
    <text x="20" y="212" fill="#94a3b8" font-size="12">Xác nhận không có dấu hiệu va chạm,</text>
    <text x="20" y="230" fill="#94a3b8" font-size="12">cháy nổ hay cướp giật. Người báo tắt máy.</text>

    <text x="20" y="265" fill="#fecaca" font-size="13" font-weight="700">• Bật Hộp Thoại Báo Khống:</text>
    <text x="20" y="287" fill="#94a3b8" font-size="12">Cán bộ bấm 'btnFlagFakeAlarm' trên Drawer</text>
    <text x="20" y="305" fill="#94a3b8" font-size="12">mở fakeAlarmConfirmModal đối soát</text>
    <text x="20" y="323" fill="#f87171" font-size="12" font-weight="700">Điểm c Khoản 3 Điều 7 Nghị định 144.</text>

    <rect x="20" y="375" width="290" height="80" rx="10" fill="rgba(220, 38, 38, 0.15)" stroke="#ef4444" stroke-width="1"/>
    <text x="32" y="402" fill="#f87171" font-size="11" font-weight="700">HÀNH ĐỘNG CỦA CÁN BỘ:</text>
    <text x="32" y="422" fill="#ffffff" font-size="12" font-weight="600">Ghi nhận biên bản hiện trường</text>
    <text x="32" y="440" fill="#cbd5e1" font-size="11">Kích hoạt lệnh đóng hồ sơ báo khống</text>
  </g>

  <!-- STEP 2 -->
  <g transform="translate(450, 180)">
    <rect width="330" height="480" rx="18" fill="url(#os-card)" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="20" y="20" width="44" height="44" rx="10" fill="#7c3aed"/>
    <text x="42" y="50" fill="#ffffff" font-size="18" font-weight="900" text-anchor="middle">2</text>
    <text x="76" y="38" fill="#c4b5fd" font-size="12" font-weight="700">CYBER FORENSICS</text>
    <text x="76" y="56" fill="#ffffff" font-size="15" font-weight="800">TRÍCH XUẤT DẤU VẾT</text>
    <line x1="20" y1="80" x2="310" y2="80" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

    <text x="20" y="115" fill="#ddd6fe" font-size="13" font-weight="700">• Trích Xuất Viễn Trắc Mạng:</text>
    <text x="20" y="137" fill="#94a3b8" font-size="12">Client IP thực (ví dụ: 14.161.42.109),</text>
    <text x="20" y="155" fill="#94a3b8" font-size="12">Nhà mạng (Viettel ASN 7552), 4G LTE.</text>

    <text x="20" y="190" fill="#ddd6fe" font-size="13" font-weight="700">• Dấu Vết Thiết Bị Phần Cứng:</text>
    <text x="20" y="212" fill="#94a3b8" font-size="12">Platform: Android 14 / SM-S928B,</text>
    <text x="20" y="230" fill="#94a3b8" font-size="12">Screen: 1440x3120, User Agent đầy đủ.</text>

    <text x="20" y="265" fill="#ddd6fe" font-size="13" font-weight="700">• Linux OSINT Automation:</text>
    <text x="20" y="287" fill="#94a3b8" font-size="12">Tự động thực thi whois, traceroute,</text>
    <text x="20" y="305" fill="#94a3b8" font-size="12">geoiplookup truy vết điểm phát sóng</text>
    <text x="20" y="323" fill="#c4b5fd" font-size="12" font-weight="700">và trạm BTS quản lý thiết bị.</text>

    <rect x="20" y="375" width="290" height="80" rx="10" fill="rgba(124, 58, 237, 0.15)" stroke="#8b5cf6" stroke-width="1"/>
    <text x="32" y="402" fill="#c4b5fd" font-size="11" font-weight="700">CHỨNG CỨ SỐ THU THẬP:</text>
    <text x="32" y="422" fill="#ffffff" font-size="12" font-weight="600">IP + BTS GPS + Hardware Hash</text>
    <text x="32" y="440" fill="#cbd5e1" font-size="11">Đầy đủ giá trị pháp lý tố tụng</text>
  </g>

  <!-- STEP 3 -->
  <g transform="translate(820, 180)">
    <rect width="330" height="480" rx="18" fill="url(#os-card)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="20" y="20" width="44" height="44" rx="10" fill="#d97706"/>
    <text x="42" y="50" fill="#ffffff" font-size="18" font-weight="900" text-anchor="middle">3</text>
    <text x="76" y="38" fill="#fbbf24" font-size="12" font-weight="700">CHẾ TÀI PHÁP LÝ</text>
    <text x="76" y="56" fill="#ffffff" font-size="15" font-weight="800">LẬP BIÊN BẢN XỬ PHẠT</text>
    <line x1="20" y1="80" x2="310" y2="80" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

    <text x="20" y="115" fill="#fef08a" font-size="13" font-weight="700">• Xuất Hồ Sơ OSINT (.txt):</text>
    <text x="20" y="137" fill="#94a3b8" font-size="12">Nhấn 'btnExportOsintDossier'</text>
    <text x="20" y="155" fill="#94a3b8" font-size="12">kết xuất toàn văn báo cáo giám định.</text>

    <text x="20" y="190" fill="#fef08a" font-size="13" font-weight="700">• Lập Biên Bản Vi Phạm Hành Chính:</text>
    <text x="20" y="212" fill="#94a3b8" font-size="12">Nhấn 'btnDraftRecord' soạn thảo</text>
    <text x="20" y="230" fill="#94a3b8" font-size="12">Biên bản theo đúng mẫu chuẩn CAND.</text>

    <text x="20" y="265" fill="#fef08a" font-size="13" font-weight="700">• Mức Xử Phạt Vi Phạm:</text>
    <text x="20" y="287" fill="#ffffff" font-size="12" font-weight="700">Phạt tiền từ 3.000.000đ đến 5.000.000đ.</text>
    <text x="20" y="305" fill="#94a3b8" font-size="12">Nếu gây hậu quả nghiêm trọng ➔</text>
    <text x="20" y="323" fill="#f87171" font-size="12" font-weight="700">Chuyển cơ quan điều tra khởi tố.</text>

    <rect x="20" y="375" width="290" height="80" rx="10" fill="rgba(217, 119, 6, 0.15)" stroke="#f59e0b" stroke-width="1"/>
    <text x="32" y="402" fill="#fbbf24" font-size="11" font-weight="700">VĂN BẢN XỬ LÝ:</text>
    <text x="32" y="422" fill="#ffffff" font-size="12" font-weight="600">Biên Bản Xác Minh NĐ 144</text>
    <text x="32" y="440" fill="#cbd5e1" font-size="11">Kèm chứng cứ dấu vết kỹ thuật số</text>
  </g>

  <!-- STEP 4 -->
  <g transform="translate(1190, 180)">
    <rect width="330" height="480" rx="18" fill="url(#os-card)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="20" y="20" width="44" height="44" rx="10" fill="#2563eb"/>
    <text x="42" y="50" fill="#ffffff" font-size="18" font-weight="900" text-anchor="middle">4</text>
    <text x="76" y="38" fill="#60a5fa" font-size="12" font-weight="700">QUẢN TRỊ HỆ THỐNG</text>
    <text x="76" y="56" fill="#ffffff" font-size="15" font-weight="800">BLACKLIST &amp; LƯU TRỮ</text>
    <line x1="20" y1="80" x2="310" y2="80" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

    <text x="20" y="115" fill="#bfdbfe" font-size="13" font-weight="700">• Khóa IP / Thiết Bị Vi Phạm:</text>
    <text x="20" y="137" fill="#94a3b8" font-size="12">Nhấn 'btnBanIpFromOsint' lập tức</text>
    <text x="20" y="155" fill="#94a3b8" font-size="12">cấm IP phát tín hiệu SOS trên toàn quốc.</text>

    <text x="20" y="190" fill="#bfdbfe" font-size="13" font-weight="700">• Kho Lưu Trữ fakeArchiveListModal:</text>
    <text x="20" y="212" fill="#94a3b8" font-size="12">Lưu vết toàn bộ hồ sơ tin giả,</text>
    <text x="20" y="230" fill="#94a3b8" font-size="12">phân loại theo số điện thoại, IP, địa bàn.</text>

    <text x="20" y="265" fill="#bfdbfe" font-size="13" font-weight="700">• Chia Sẻ Dữ Liệu Tội Phạm:</text>
    <text x="20" y="287" fill="#94a3b8" font-size="12">Đồng bộ danh sách đen sang cơ sở dữ liệu</text>
    <text x="20" y="305" fill="#94a3b8" font-size="12">Công an khu vực để theo dõi đối tượng</text>
    <text x="20" y="323" fill="#60a5fa" font-size="12" font-weight="700">và răn đe giáo dục tại cộng đồng.</text>

    <rect x="20" y="375" width="290" height="80" rx="10" fill="rgba(37, 99, 235, 0.15)" stroke="#3b82f6" stroke-width="1"/>
    <text x="32" y="402" fill="#60a5fa" font-size="11" font-weight="700">HIỆU LỰC TOÀN QUỐC:</text>
    <text x="32" y="422" fill="#ffffff" font-size="12" font-weight="600">Blacklist Database • Vĩnh viễn</text>
    <text x="32" y="440" fill="#cbd5e1" font-size="11">Ngăn chặn triệt để hành vi quấy rối</text>
  </g>

  <!-- Connective Arrows -->
  <g stroke="#ef4444" stroke-width="2.5" fill="none" opacity="0.8">
    <path d="M 410 420 L 445 420"/>
    <path d="M 780 420 L 815 420"/>
    <path d="M 1150 420 L 1185 420"/>
  </g>

  <!-- Footer -->
  <g transform="translate(80, 700)">
    <rect width="1440" height="150" rx="14" fill="rgba(17, 24, 39, 0.85)" stroke="rgba(255,255,255,0.1)"/>
    <text x="30" y="40" fill="#fca5a5" font-size="16" font-weight="800">CƠ SỞ PHÁP LÝ VÀ CHẾ TÀI XỬ LÝ THEO PHÁP LUẬT VIỆT NAM HIỆN HÀNH:</text>
    <text x="30" y="75" fill="#ffffff" font-size="13" font-weight="600">1. Nghị định số 144/2021/NĐ-CP:</text>
    <text x="270" y="75" fill="#94a3b8" font-size="13">Điểm c Khoản 3 Điều 7 quy định phạt tiền từ 3.000.000 đồng đến 5.000.000 đồng đối với hành vi 'Báo thông tin giả, không đúng sự thật đến các cơ quan, tổ chức có thẩm quyền'.</text>
    <text x="30" y="105" fill="#ffffff" font-size="13" font-weight="600">2. Bộ luật Hình sự số 100/2015/QH13:</text>
    <text x="270" y="105" fill="#94a3b8" font-size="13">Nếu hành vi báo tin giả gây thiệt hại nghiêm trọng về kinh tế hoặc đe dọa tính mạng người thi hành công vụ sẽ bị truy cứu hình sự về tội Gây rối trật tự công cộng (Điều 318).</text>
    <text x="30" y="132" fill="#ffffff" font-size="13" font-weight="600">3. Luật An ninh mạng số 24/2018/QH14:</text>
    <text x="270" y="132" fill="#94a3b8" font-size="13">Nghiêm cấm phát tán thông tin giả mạo trên không gian mạng; chứng cứ điện tử thu thập từ hệ thống OSINT là căn cứ xác minh hợp pháp tại Tòa án.</text>
  </g>
</svg>